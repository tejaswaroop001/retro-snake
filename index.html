<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAKE OS v1.0</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Default: Green Phosphor */
            --bg-color: #051405;
            --fg-color: #33ff33;
            --glow-color: rgba(51, 255, 51, 0.6);
            --monitor-bg: #1a1a1a;
        }

        body.theme-amber {
            --bg-color: #1a0a00;
            --fg-color: #ffb000;
            --glow-color: rgba(255, 176, 0, 0.6);
        }

        body.theme-neon {
            --bg-color: #000510;
            --fg-color: #00ffff;
            --glow-color: rgba(0, 255, 255, 0.6);
            --secondary-color: #ff00ff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'VT323', monospace;
            color: var(--fg-color);
            overflow: hidden;
        }

        /* Ambient Room Lighting */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
            pointer-events: none;
        }

        #arcade-cabinet {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* The physical monitor bezel */
        #monitor {
            background-color: var(--monitor-bg);
            padding: 4vw;
            border-radius: 40px;
            box-shadow: 
                inset 0 0 20px #000,
                0 20px 50px rgba(0,0,0,0.8),
                0 0 100px rgba(0,0,0,0.5);
            position: relative;
            border: 2px solid #2a2a2a;
            max-width: 95vw;
            max-height: 95vh;
        }

        /* Fake speaker grills / details */
        #monitor::before, #monitor::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 60px;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, #111 2px, #111 4px);
            top: 50%;
            transform: translateY(-50%);
        }
        #monitor::before { left: 1.5vw; }
        #monitor::after { right: 1.5vw; }

        /* The actual screen glass */
        #screen-glass {
            position: relative;
            width: min(80vw, 600px);
            height: min(80vw, 600px);
            background-color: var(--bg-color);
            border-radius: 20px; /* curved CRT corners */
            overflow: hidden;
            box-shadow: 
                inset 0 0 40px rgba(0,0,0,0.9),
                0 0 20px var(--glow-color);
        }

        /* --- CRT EFFECTS --- */
        #crt-effects {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Scanlines */
        #crt-effects::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        /* Screen Curvature Vignette & Reflection */
        #crt-effects::after {
            content: "";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: 
                radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.6) 100%),
                linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0.02) 50%, transparent 54%);
            z-index: 3;
            border-radius: 20px;
        }

        /* Flicker */
        @keyframes crt-flicker {
            0% { opacity: 0.95; }
            5% { opacity: 0.85; }
            10% { opacity: 0.95; }
            15% { opacity: 1; }
            100% { opacity: 1; }
        }
        .flicker-anim {
            animation: crt-flicker 0.15s infinite;
        }

        /* Chromatic Aberration Text */
        .crt-text {
            text-shadow: 
                2px 0 0 rgba(255,0,0,0.5), 
                -2px 0 0 rgba(0,0,255,0.5),
                0 0 10px var(--glow-color);
        }

        /* Glitch Animation */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        .glitch-active {
            animation: glitch 0.2s cubic-bezier(.25, .46, .45, .94) both infinite;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* Essential for retro feel */
        }

        /* UI Layers */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            padding: 5%;
        }

        .hidden { display: none !important; }

        /* HUD */
        #hud {
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            width: 100%;
            position: absolute;
            top: 5%; left: 0;
            padding: 0 5%;
        }

        /* Screens */
        .screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0,0,0,0.7);
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            margin: 0 0 20px 0;
            line-height: 1;
        }

        p {
            font-size: 1.5rem;
            margin: 10px 0;
        }

        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Boot Sequence */
        #boot-screen {
            background-color: var(--bg-color);
            align-items: flex-start;
            justify-content: flex-start;
            padding: 20px;
            font-size: 1.2rem;
            text-align: left;
        }
        #boot-text p {
            margin: 2px 0;
            font-size: 1.2rem;
        }

        /* Controls */
        #controls-help {
            margin-top: 30px;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.7);
        }

        /* Theme Switcher */
        #theme-switcher {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .theme-btn {
            background: transparent;
            border: 2px solid var(--fg-color);
            color: var(--fg-color);
            font-family: 'VT323', monospace;
            font-size: 1rem;
            padding: 5px 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .theme-btn:hover, .theme-btn.active {
            background: var(--fg-color);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--glow-color);
        }

        /* Touch Controls for Mobile */
        #touch-controls {
            display: none;
            position: absolute;
            bottom: 10%;
            width: 100%;
            height: 40%;
            z-index: 20;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            #screen-glass { border-radius: 10px; }
            #monitor { padding: 2vw; border-radius: 20px; }
            #touch-controls { display: block; }
        }
    </style>
</head>
<body class="theme-green">
    <div id="arcade-cabinet">
        <div id="monitor">
            <div id="screen-glass" class="flicker-anim">
                <div id="crt-effects"></div>
                <canvas id="gameCanvas" width="400" height="400"></canvas>
                
                <div id="ui-layer">
                    <div id="hud" class="crt-text hidden">
                        <div>SCORE: <span id="score-val">0</span></div>
                        <div>HI: <span id="hi-score-val">0</span></div>
                    </div>

                    <div id="boot-screen" class="screen-overlay crt-text">
                        <div id="boot-text"></div>
                    </div>

                    <div id="start-screen" class="screen-overlay crt-text hidden">
                        <h1>SNAKE OS</h1>
                        <p class="blink">INSERT COIN</p>
                        <p style="font-size: 1rem; margin-top: 5px;">(PRESS SPACE OR TAP)</p>
                        <div id="controls-help">
                            [W][A][S][D] or ARROWS to move<br>
                            SWIPE on touch screens<br>
                            [P] to Pause
                        </div>
                        <div id="theme-switcher">
                            <button class="theme-btn active" data-theme="theme-green">GRN</button>
                            <button class="theme-btn" data-theme="theme-amber">AMB</button>
                            <button class="theme-btn" data-theme="theme-neon">NEO</button>
                        </div>
                    </div>

                    <div id="game-over-screen" class="screen-overlay crt-text hidden">
                        <h1 class="glitch-active">GAME OVER</h1>
                        <p>SCORE: <span id="final-score">0</span></p>
                        <p class="blink" style="margin-top: 30px;">PRESS SPACE TO RESTART</p>
                    </div>

                    <div id="pause-screen" class="screen-overlay crt-text hidden">
                        <h1>PAUSED</h1>
                        <p class="blink">PRESS [P] TO RESUME</p>
                    </div>
                </div>
            </div>
            <!-- Touch interaction layer -->
            <div id="touch-controls"></div>
        </div>
    </div>

    <script>
        // --- Web Audio Synthesizer ---
        class AudioEngine {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.3; // Default volume
                this.masterGain.connect(this.ctx.destination);
                this.initialized = true;
            }

            playTone(freq, type = 'square', duration = 0.1, vol = 1) {
                if(!this.initialized) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(this.masterGain);
                
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            playEat() {
                // Short, high pitch ascending blip
                if(!this.initialized) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playDie() {
                // Descending frequency + noise
                if(!this.initialized) return;
                
                // Tone
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.5);
                
                gain.gain.setValueAtTime(1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
                
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);

                // Noise burst
                const bufferSize = this.ctx.sampleRate * 0.5; // 0.5 seconds
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                
                const noiseFilter = this.ctx.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.value = 1000;

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(this.masterGain);
                
                noise.start();
            }

            playStart() {
                // Power up sound
                if(!this.initialized) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + 0.3);
                
                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(1, this.ctx.currentTime + 0.1);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.4);
                
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
            
            playMove() {
                this.playTone(200, 'square', 0.05, 0.1);
            }
        }

        let audio = null;

        // --- Game Setup & State ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const bootScreen = document.getElementById('boot-screen');
        const bootTextContainer = document.getElementById('boot-text');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const pauseScreen = document.getElementById('pause-screen');
        const hud = document.getElementById('hud');
        const scoreEl = document.getElementById('score-val');
        const hiScoreEl = document.getElementById('hi-score-val');
        const finalScoreEl = document.getElementById('final-score');
        const screenGlass = document.getElementById('screen-glass');
        const touchControlsLayer = document.getElementById('touch-controls');

        const STATE = {
            BOOT: 0,
            MENU: 1,
            PLAYING: 2,
            PAUSED: 3,
            GAMEOVER: 4
        };
        let currentState = STATE.BOOT;

        // Game Variables
        const gridSize = 20; // 20x20 grid (canvas is 400x400)
        let tileCountX = canvas.width / gridSize;
        let tileCountY = canvas.height / gridSize;

        let snake = [];
        let snakeLen = 4;
        let headX = 10;
        let headY = 10;
        let velocityX = 0;
        let velocityY = 0;
        let nextVelocityX = 0;
        let nextVelocityY = 0;
        
        let appleX = 15;
        let appleY = 10;

        let score = 0;
        let highScore = localStorage.getItem('snakeOS_highScore') || 0;
        hiScoreEl.innerText = highScore;

        // Loop control
        let lastRenderTime = 0;
        let snakeSpeed = 8; // moves per second
        let gameLoopId;
        
        // Particles for explosion
        let particles = [];

        // Visual Colors (derived from CSS)
        function getThemeColors() {
            const computed = getComputedStyle(document.body);
            let fg = computed.getPropertyValue('--fg-color').trim();
            // Handle Neon theme special case
            let isNeon = document.body.classList.contains('theme-neon');
            let sec = isNeon ? computed.getPropertyValue('--secondary-color').trim() : fg;
            return { fg, sec };
        }

        // --- Boot Sequence Simulation ---
        const bootMessages = [
            "BIOS DATE 04/20/89 14:02:11",
            "CPU: 6502 @ 1.02 MHz",
            "MEMORY: 64K RAM SYSTEM",
            "OK",
            "",
            "LOADING SNAKE OS v1.0...",
            "INITIALIZING DISPLAY ADAPTER...",
            "OK",
            "CHECKING AUDIO HARDWARE...",
            "OK",
            "",
            "READY."
        ];

        async function runBootSequence() {
            bootScreen.classList.remove('hidden');
            for(let i = 0; i < bootMessages.length; i++) {
                let p = document.createElement('p');
                p.innerText = bootMessages[i];
                bootTextContainer.appendChild(p);
                // random delay for realism
                let delay = bootMessages[i] === "" ? 100 : 200 + Math.random() * 300;
                await new Promise(r => setTimeout(r, delay));
            }
            await new Promise(r => setTimeout(r, 800));
            bootScreen.classList.add('hidden');
            showMenu();
        }

        function showMenu() {
            currentState = STATE.MENU;
            startScreen.classList.remove('hidden');
            hud.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            pauseScreen.classList.add('hidden');
            drawMenuBackground();
        }

        function drawMenuBackground() {
            if(currentState !== STATE.MENU) return;
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg-color');
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw a subtle snake pattern
            let colors = getThemeColors();
            ctx.fillStyle = colors.fg;
            ctx.globalAlpha = 0.1;
            for(let i=0; i<tileCountX; i+=2) {
                for(let j=0; j<tileCountY; j+=2) {
                    ctx.fillRect(i*gridSize, j*gridSize, gridSize-1, gridSize-1);
                }
            }
            ctx.globalAlpha = 1.0;
        }

        // --- Game Flow ---
        function initAudioContext() {
            if (!audio) {
                audio = new AudioEngine();
                // To resume audio context in browsers that suspend it
                if(audio.ctx.state === 'suspended') {
                    audio.ctx.resume();
                }
            }
        }

        function startGame() {
            initAudioContext();
            audio.playStart();
            
            currentState = STATE.PLAYING;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            screenGlass.classList.remove('glitch-active');
            
            // Reset state
            snakeLen = 4;
            score = 0;
            scoreEl.innerText = score;
            snakeSpeed = 8;
            headX = 10;
            headY = 10;
            velocityX = 1;
            velocityY = 0;
            nextVelocityX = 1;
            nextVelocityY = 0;
            snake = [];
            for(let i = 0; i < snakeLen; i++) {
                snake.push({x: headX - i, y: headY});
            }
            particles = [];
            placeApple();
            
            lastRenderTime = 0;
            if(gameLoopId) cancelAnimationFrame(gameLoopId);
            gameLoopId = requestAnimationFrame(main);
        }

        function togglePause() {
            if(currentState === STATE.PLAYING) {
                currentState = STATE.PAUSED;
                pauseScreen.classList.remove('hidden');
                audio.playTone(300, 'square', 0.1);
            } else if(currentState === STATE.PAUSED) {
                currentState = STATE.PLAYING;
                pauseScreen.classList.add('hidden');
                audio.playTone(600, 'square', 0.1);
                lastRenderTime = performance.now(); // prevent huge jump
                gameLoopId = requestAnimationFrame(main);
            }
        }

        function gameOver() {
            currentState = STATE.GAMEOVER;
            audio.playDie();
            
            // Screen shake / Glitch effect
            screenGlass.classList.add('glitch-active');
            
            if(score > highScore) {
                highScore = score;
                localStorage.setItem('snakeOS_highScore', highScore);
                hiScoreEl.innerText = highScore;
            }
            
            finalScoreEl.innerText = score;
            gameOverScreen.classList.remove('hidden');
            hud.classList.add('hidden');
        }

        // --- Main Game Loop ---
        function main(currentTime) {
            if(currentState !== STATE.PLAYING) return;
            
            gameLoopId = requestAnimationFrame(main);
            
            const secondsSinceLastRender = (currentTime - lastRenderTime) / 1000;
            if(secondsSinceLastRender < 1 / snakeSpeed) return;
            
            lastRenderTime = currentTime;
            
            update();
            draw();
        }

        function update() {
            // Apply next queued velocity
            velocityX = nextVelocityX;
            velocityY = nextVelocityY;
            
            headX += velocityX;
            headY += velocityY;
            
            // Wall Collision (Game Over)
            if(headX < 0 || headX >= tileCountX || headY < 0 || headY >= tileCountY) {
                gameOver();
                return;
            }

            // Self Collision
            for(let i = 0; i < snake.length; i++) {
                if(snake[i].x === headX && snake[i].y === headY) {
                    gameOver();
                    return;
                }
            }

            // Add new head
            snake.unshift({x: headX, y: headY});

            // Apple Collision
            if(headX === appleX && headY === appleY) {
                score += 10;
                scoreEl.innerText = score;
                snakeLen++;
                snakeSpeed = Math.min(25, 8 + Math.floor(score / 50)); // Increase speed
                audio.playEat();
                createExplosion(appleX * gridSize + gridSize/2, appleY * gridSize + gridSize/2);
                placeApple();
            } else {
                // Remove tail if no apple eaten
                while(snake.length > snakeLen) {
                    snake.pop();
                }
            }
            
            updateParticles();
        }

        function draw() {
            let colors = getThemeColors();
            
            // Clear screen
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg-color');
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw Apple
            ctx.fillStyle = colors.sec;
            // Draw glowing apple
            ctx.shadowBlur = 10;
            ctx.shadowColor = colors.sec;
            // Apple shape (slightly smaller than grid)
            ctx.fillRect(appleX * gridSize + 2, appleY * gridSize + 2, gridSize - 4, gridSize - 4);
            ctx.shadowBlur = 0;

            // Draw Snake
            for(let i = 0; i < snake.length; i++) {
                // Head is solid, body has a gap
                ctx.fillStyle = i === 0 ? colors.sec : colors.fg;
                
                if(i===0) {
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = colors.fg;
                } else {
                    ctx.shadowBlur = 0;
                }
                
                ctx.fillRect(snake[i].x * gridSize + 1, snake[i].y * gridSize + 1, gridSize - 2, gridSize - 2);
            }
            
            ctx.shadowBlur = 0;
            drawParticles(colors.sec);
        }

        function placeApple() {
            let valid = false;
            while(!valid) {
                appleX = Math.floor(Math.random() * tileCountX);
                appleY = Math.floor(Math.random() * tileCountY);
                valid = true;
                for(let part of snake) {
                    if(part.x === appleX && part.y === appleY) {
                        valid = false;
                        break;
                    }
                }
            }
        }

        // --- Particles ---
        function createExplosion(x, y) {
            for(let i=0; i<8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0
                });
            }
        }

        function updateParticles() {
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.1;
                if(p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles(color) {
            ctx.fillStyle = color;
            for(let p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 4, 4);
            }
            ctx.globalAlpha = 1.0;
        }

        // --- Input Handling ---
        function handleInput(key) {
            if(currentState === STATE.MENU || currentState === STATE.GAMEOVER) {
                if(key === ' ' || key === 'Enter') startGame();
                return;
            }
            
            if(currentState === STATE.PLAYING || currentState === STATE.PAUSED) {
                if(key === 'p' || key === 'P') {
                    togglePause();
                    return;
                }
            }

            if(currentState !== STATE.PLAYING) return;

            // Prevent reversing direction
            if((key === 'ArrowUp' || key === 'w' || key === 'W') && velocityY !== 1) {
                nextVelocityX = 0; nextVelocityY = -1;
                if(audio) audio.playMove();
            }
            if((key === 'ArrowDown' || key === 's' || key === 'S') && velocityY !== -1) {
                nextVelocityX = 0; nextVelocityY = 1;
                if(audio) audio.playMove();
            }
            if((key === 'ArrowLeft' || key === 'a' || key === 'A') && velocityX !== 1) {
                nextVelocityX = -1; nextVelocityY = 0;
                if(audio) audio.playMove();
            }
            if((key === 'ArrowRight' || key === 'd' || key === 'D') && velocityX !== -1) {
                nextVelocityX = 1; nextVelocityY = 0;
                if(audio) audio.playMove();
            }
        }

        window.addEventListener('keydown', e => {
            // Prevent default scrolling for arrows and space
            if(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) > -1) {
                e.preventDefault();
            }
            handleInput(e.key);
        });

        // Touch Input / Swipe
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            
            if(currentState === STATE.MENU || currentState === STATE.GAMEOVER) {
                // Initialize audio context on first user interaction to bypass browser autoplay policies
                initAudioContext();
                startGame();
            }
        }, {passive: false});

        document.addEventListener('touchend', e => {
            if(currentState !== STATE.PLAYING) return;
            
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;
            
            // Threshold to register swipe
            if(Math.abs(dx) > 30 || Math.abs(dy) > 30) {
                if(Math.abs(dx) > Math.abs(dy)) {
                    // Horizontal swipe
                    if(dx > 0) handleInput('ArrowRight');
                    else handleInput('ArrowLeft');
                } else {
                    // Vertical swipe
                    if(dy > 0) handleInput('ArrowDown');
                    else handleInput('ArrowUp');
                }
            }
        }, {passive: false});

        // Prevent default touch moves to stop scrolling
        document.addEventListener('touchmove', e => {
            if(e.target === touchControlsLayer || e.target === canvas) {
                e.preventDefault();
            }
        }, {passive: false});

        // Theme Switcher Logic
        const themeBtns = document.querySelectorAll('.theme-btn');
        themeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation(); // Prevent triggering startGame
                initAudioContext();
                audio.playTone(800, 'square', 0.05); // UI click sound
                
                themeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                document.body.className = '';
                document.body.classList.add(btn.dataset.theme);
                
                if(currentState === STATE.MENU) drawMenuBackground();
                if(currentState === STATE.PLAYING) draw();
            });
        });

        // Start Boot Sequence
        window.onload = () => {
            runBootSequence();
        };

    </script>
</body>
</html>
